services:
  db:
    image: postgres:16
    container_name: postgres_dev_db
    restart: always
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/persistence/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/persistence/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: backend_dev
    depends_on:
      - db
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: frontend_dev
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer_dev
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  postgres_dev_data:
  backend:
  frontend:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
